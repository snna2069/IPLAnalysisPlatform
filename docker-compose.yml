services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
      AIRFLOW_UID: "${AIRFLOW_UID:-50000}"
      PYTHONPATH: /opt/airflow/project
      IPL_DATA_DIR: /opt/airflow/project/data
      IPL_RAW_DIR: /opt/airflow/project/data/raw
      IPL_SOURCE_URLS: '${IPL_SOURCE_URLS:-{"matches":"https://cricsheet.org/downloads/ipl_json.zip"}}'
      IPL_REQUIRED_COLUMNS: '${IPL_REQUIRED_COLUMNS:-{}}'
      IPL_AIRFLOW_SCHEDULE: '${IPL_AIRFLOW_SCHEDULE:-}'
      SNOWFLAKE_ACCOUNT: '${SNOWFLAKE_ACCOUNT:-}'
      SNOWFLAKE_USER: '${SNOWFLAKE_USER:-}'
      SNOWFLAKE_PASSWORD: '${SNOWFLAKE_PASSWORD:-}'
      SNOWFLAKE_ROLE: '${SNOWFLAKE_ROLE:-}'
      SNOWFLAKE_WAREHOUSE: '${SNOWFLAKE_WAREHOUSE:-IPL_ANALYTICS_WH}'
      SNOWFLAKE_DATABASE: '${SNOWFLAKE_DATABASE:-IPL_ANALYTICS}'
      # The Python loader writes to RAW; dbt builds into its own schemas. Keeping
      # these separate stops dbt --store-failures artifacts landing in the raw zone.
      SNOWFLAKE_SCHEMA: '${SNOWFLAKE_SCHEMA:-RAW}'
      DBT_TARGET_SCHEMA: '${DBT_TARGET_SCHEMA:-ANALYTICS}'
      # Generate with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # Without a stable value Airflow re-keys on restart and saved connections
      # become unreadable; without a stable secret key active sessions are dropped.
      AIRFLOW__CORE__FERNET_KEY: '${AIRFLOW_FERNET_KEY:-}'
      AIRFLOW__WEBSERVER__SECRET_KEY: '${AIRFLOW_SECRET_KEY:-}'
    volumes: &airflow-volumes
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/airflow/project
    user: "${AIRFLOW_UID:-50000}:0"
    command: >-
      bash -c "set -e;
      airflow db migrate;
      airflow users create --username ${AIRFLOW_ADMIN_USERNAME:-airflow}
      --password ${AIRFLOW_ADMIN_PASSWORD:-airflow}
      --firstname IPL --lastname Admin --role Admin
      --email ${AIRFLOW_ADMIN_EMAIL:-airflow@example.com}
      || echo 'Admin user already exists; continuing.'"

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-environment
    volumes: *airflow-volumes
    user: "${AIRFLOW_UID:-50000}:0"
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-environment
    volumes: *airflow-volumes
    user: "${AIRFLOW_UID:-50000}:0"
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres-db-volume:

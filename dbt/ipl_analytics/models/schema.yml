version: 2

models:
  - name: stg_matches
    description: One cleaned row per source match.
    columns:
      - name: match_id
        description: Stable source match identifier.
        tests: [not_null, unique]
      - name: season
        description: IPL season represented as a string for source compatibility.
        tests: [not_null]
      - name: toss_decision
        description: Decision made by the toss winner, normalized to lower case.
        tests:
          - accepted_values:
              arguments:
                values: ['bat', 'field']
                quote: true
      - name: toss_winner
        description: >
          Team that won the toss, read from Cricsheet info.toss.winner. Cricsheet
          records a toss for every completed IPL fixture, so a null here means the
          source path has regressed rather than that the toss was unknown.
        tests: [not_null]
      - name: win_by_runs
        description: >
          Victory margin in runs from Cricsheet info.outcome.by.runs. Null means the
          margin does not apply (a wicket-margin win, tie, or no result).
      - name: win_by_wickets
        description: >
          Victory margin in wickets from Cricsheet info.outcome.by.wickets. Null means
          the margin does not apply.
      - name: eliminator
        description: Team that won a super over, set by Cricsheet only when the match was tied.
      - name: result_method
        description: Cricsheet info.outcome.method, such as D/L, when a method decided the result.
      - name: match_date
        description: Match date parsed as a Snowflake DATE.
      - name: venue
        description: Standardized venue name.
      - name: team_1
        description: First team listed by the source.
      - name: team_2
        description: Second team listed by the source.
  - name: stg_deliveries
    description: One cleaned row per ball from match innings data.
    columns:
      - name: delivery_id
        description: Deterministic match, innings, over, and ball identifier.
        tests: [not_null, unique]
      - name: match_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_matches')
                field: match_id
      - name: batter
        tests: [not_null]
      - name: bowler
        tests: [not_null]
      - name: team_wickets
        description: All dismissals on the delivery except retired hurt; can exceed one.
        tests: [not_null]
      - name: bowler_wickets
        description: Bowled, caught, caught and bowled, lbw, stumped, and hit wicket only.
        tests: [not_null]
  - name: stg_players
    description: Cleaned player records from the source player table.
    columns:
      - name: player_id
        tests: [not_null, unique]
      - name: player_name
        tests: [not_null]
  - name: stg_teams
    description: Cleaned team records with standardized names.
    columns:
      - name: team_id
        tests: [not_null, unique]
      - name: team_name
        tests: [not_null]

  - name: int_match_deliveries
    description: Delivery-level cricket calculations used by delivery facts.
    columns:
      - name: is_super_over
        description: >
          True when the delivery belongs to a super over. Retained in delivery
          facts for drill-down, excluded from regular-innings performance and totals.
        tests: [not_null]
      - name: is_ball_faced
        description: One for non-wide deliveries, including no-balls.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: bowler_runs_conceded
        description: Total runs minus byes, leg-byes, and penalty runs.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: delivery_id
        tests: [not_null, unique]
      - name: batter_runs
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: total_runs
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= batter_runs"
      - name: match_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_match')
                field: match_id
  - name: int_player_match_performance
    description: Regular-innings batting and bowling aggregates by player and match; excludes super overs.
  - name: int_match_results
    description: Match-level winner and margin calculations.
    columns:
      - name: match_winner
        description: >
          Team that actually won the match: outcome.winner, or the super-over
          eliminator when the scheduled innings were tied. Null for a no result.
      - name: winner_side
        description: >
          Whichever of team_1 or team_2 won. Null when the match had no winner, so
          abandoned fixtures are never attributed to a team.
      - name: result_type
        description: >
          Normalized outcome: 'win' when Cricsheet omits outcome.result, otherwise the
          source value ('tie', 'no result', or 'draw').
        tests: [not_null]

  - name: dim_player
    description: Analytics player dimension.
    columns:
      - name: player_key
        tests: [not_null, unique]
      - name: player_id
        tests: [not_null, unique]
      - name: player_name
        tests: [not_null]
  - name: dim_team
    description: Analytics team dimension.
    columns:
      - name: team_key
        tests: [not_null, unique]
      - name: team_id
        tests: [not_null, unique]
      - name: team_name
        tests: [not_null]
  - name: dim_season
    description: Analytics season dimension.
    columns:
      - name: season_key
        tests: [not_null, unique]
      - name: season
        tests: [not_null, unique]
  - name: dim_venue
    description: Analytics venue dimension.
    columns:
      - name: venue_key
        tests: [not_null, unique]
      - name: venue
        tests: [not_null, unique]
  - name: dim_match
    description: Analytics match dimension.
    columns:
      - name: match_key
        tests: [not_null, unique]
      - name: match_id
        tests: [not_null, unique]
      - name: season_key
        description: Foreign key to dim_season.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_season')
                field: season_key
      - name: venue_key
        description: Foreign key to dim_venue.
        tests:
          - relationships:
              arguments:
                to: ref('dim_venue')
                field: venue_key
  - name: fact_deliveries
    description: Analytics fact table at ball grain.
    columns:
      - name: delivery_key
        tests: [not_null, unique]
      - name: match_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_match')
                field: match_key
      - name: batter_runs
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: total_runs
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= batter_runs"
  - name: fact_matches
    description: Analytics fact table at match grain.
    columns:
      - name: match_key
        tests: [not_null, unique]
      - name: winner_key
        description: Match winner key, including the super-over decider; null for unresolved results.
        tests:
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_key
      - name: season_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_season')
                field: season_key
      - name: venue_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_venue')
                field: venue_key
      - name: team_1_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_key
      - name: team_2_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_key
  - name: fact_player_performance
    description: Analytics player performance fact table at match grain.
    columns:
      - name: performance_key
        tests: [not_null, unique]
      - name: match_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_match')
                field: match_key
      - name: player_key
        description: Deterministic player reference generated from player name.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_player')
                field: player_key
      - name: balls_faced
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: balls_bowled
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: runs_conceded
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: runs_scored
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: wickets
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

  - name: bridge_match_team
    description: Two rows per match, one per participating team, with opponent and resolved win flag.
    columns:
      - name: match_team_key
        tests: [not_null, unique]
      - name: match_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_match')
                field: match_key
      - name: team_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_key
      - name: is_win
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
  - name: bridge_player_match_team
    description: Player representation from the latest revision's Cricsheet roster, including players with no batting or bowling performance.
    columns:
      - name: player_match_key
        tests: [not_null, unique]
      - name: match_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_match')
                field: match_key
      - name: player_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_player')
                field: player_key
      - name: team_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_key
  - name: fact_season_results
    description: Season champion only when one explicitly marked final exists and has a resolved winner.
    columns:
      - name: season_key
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_season')
                field: season_key
      - name: season
        tests: [not_null, unique]

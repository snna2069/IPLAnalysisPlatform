version: 2

sources:
  - name: raw
    description: Immutable IPL records loaded by the Python ingestion layer.
    database: IPL_ANALYTICS
    schema: RAW
    config:
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 72, period: hour}
      loaded_at_field: LOADED_AT
    tables:
      - name: raw_matches
        description: Source match records stored as Snowflake VARIANT payloads; freshness is based on the raw load timestamp.
      - name: raw_deliveries
        description: Source delivery records stored as Snowflake VARIANT payloads.
      - name: raw_players
        description: Source player records stored as Snowflake VARIANT payloads.
      - name: raw_teams
        description: Source team records stored as Snowflake VARIANT payloads.
